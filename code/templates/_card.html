<article class="card">
  <img class="avatar" src="{{ thumb(p) }}" alt="">
  <div class="body">
    <span class="kind">{{ post_types[p.type] }}{% if p.sanitized %} <span class="badge">Sanitized</span>{% endif %}</span>
    <h3><a href="{{ url_for('public.post', slug=p.slug) }}">{{ p.title }}</a></h3>
    <p>{{ p.summary }}</p>
    <div class="tags">{% for t in p.tags %}<a class="tag" href="{{ url_for('public.tag', name=t.name) }}">#{{ t.name }}</a>{% endfor %}</div>
    <small>{{ p.created_at.strftime('%d %b %Y') }}</small>
  </div>
</article>
